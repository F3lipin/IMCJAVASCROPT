<html lang="pt-br">
<head>

    <title>IMC</title>

</head>
    <div id="h1">
        <h1>Calculadora de IMC</h1>

<body>
    <label for="peso">Peso (kg):</label>

    <button id="calcularBtn">Calcular IMC</button>

    <p id="resultado">Resultado aparecerá aqui</p>

    <script src="javinha.js"></script>
</body>
